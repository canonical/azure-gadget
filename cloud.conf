#cloud-config
datasource:
  Azure:
    apply_network_config: true

runcmd:
  - [ bash, -lc, "mkdir -p /etc/motd.d && ln -sf /dev/null /etc/motd.d/50-default" ]
  # The ovf-env handoff below must run AFTER snapd has finished seeding: the
  # waagent snap (and its /var/snap/waagent/current data dir) does not exist
  # until then. bootcmd runs ~40s too early (pre-network, before snapd even
  # starts), so a bootcmd copy would silently no-op. `snap wait system
  # seed.loaded` blocks until seeding completes.
  - [ bash, -lc, "snap wait system seed.loaded" ]
  # Hand the provisioning ovf-env.xml over to the waagent snap. The snap binds
  # /var/lib/waagent to $SNAP_DATA via a layout, so the agent never sees the
  # host file cloud-init wrote provisioning data to. cloud-init runs unconfined
  # and can see both sides; copy it across before wait_for_ovfenv times out.
  - [ bash, -lc, "src=/var/lib/waagent/ovf-env.xml; dst=/var/snap/waagent/current/var/lib/waagent; if [ -f \"$src\" ]; then mkdir -p \"$dst\" && cp -f \"$src\" \"$dst/ovf-env.xml\"; fi" ]

write_files:
  - path: /etc/ssh/sshd_config.d/50-cloudimg-settings.conf
    owner: root:root
    permissions: "0644"
    content: |
      # Keep alive ssh connections by sending a packet every 2 minutes.
      # Azure LB default idle timeout is 4 minutes, so this will keep
      # the connection alive.
      # See https://learn.microsoft.com/en-us/azure/load-balancer/load-balancer-tcp-reset
      ClientAliveInterval 120
  - path: /etc/motd.d/99-custom-azure-cloud
    owner: root:root
    permissions: "0644"
    defer: true
    content: |
      Welcome to Ubuntu Core 26

      * Documentation: https://ubuntu.com/core/docs

      This is a pre-built Ubuntu Core image. Pre-built images are ideal for
      exploration as you develop your own custom Ubuntu Core image.

      To learn how to create your custom Ubuntu Core image, see our guide:

      * Getting Started: https://ubuntu.com/core/docs/get-started

      * First steps: https://ubuntu.com/core/docs/first-steps
